name: Release on merge to main

on:
  push:
    branches: [ main ]

permissions:
  contents: write
  pull-requests: write

jobs:
  create_release:
    name: Create GitHub Release and open RELEASE_NOTES PR
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: true
          tags: true

      - name: Find tag that points to HEAD
        id: find_tag
        run: |
          tags=$(git tag --points-at HEAD || true)
          echo "tags=$tags" >> $GITHUB_OUTPUT
          if [ -z "$tags" ]; then
            echo "no_tag=true" >> $GITHUB_OUTPUT
          else
            match=$(echo "$tags" | grep -E '^v' | head -n1 || true)
            if [ -n "$match" ]; then
              tag_name="$match"
            else
              tag_name=$(echo "$tags" | head -n1)
            fi
            echo "tag_name=$tag_name" >> $GITHUB_OUTPUT
          fi
        shell: bash

      - name: Read current VERSION
        id: read_version
        run: |
          if [ -f VERSION ]; then
            current=$(cat VERSION | tr -d '\r\n' | tr -d '[:space:]')
            echo "current=$current" >> $GITHUB_OUTPUT
          else
            echo "current=" >> $GITHUB_OUTPUT
          fi
        shell: bash

      - name: Read previous VERSION
        id: prev_version
        run: |
          prev=""
          if git rev-parse --verify HEAD^ >/dev/null 2>&1; then
            prev=$(git show HEAD^:VERSION 2>/dev/null || true)
            prev=$(echo "$prev" | tr -d '\r\n' | tr -d '[:space:]')
          fi
          echo "prev=$prev" >> $GITHUB_OUTPUT
        shell: bash

      - name: Determine tag to use
        id: determine_tag
        run: |
          if [ "${{ steps.find_tag.outputs.no_tag }}" != "true" ]; then
            echo "tag_name=${{ steps.find_tag.outputs.tag_name }}" >> $GITHUB_OUTPUT
          elif [ -n "${{ steps.read_version.outputs.current }}" ] && [ "${{ steps.read_version.outputs.current }}" != "${{ steps.prev_version.outputs.prev }}" ]; then
            ver=${{ steps.read_version.outputs.current }}
            if [[ "$ver" != v* ]]; then
              echo "tag_name=v$ver" >> $GITHUB_OUTPUT
            else
              echo "tag_name=$ver" >> $GITHUB_OUTPUT
            fi
          else
            echo "tag_name=" >> $GITHUB_OUTPUT
          fi
        shell: bash

      - name: Generate commit-based notes
        id: commit_notes
        run: |
          # Generate a short bullet list from commits included in this push (skip merge commits)
          notes=$(git --no-pager log --no-merges --pretty=format:'- %s' HEAD^..HEAD 2>/dev/null || true)
          if [ -z "$notes" ]; then
            # fallback: last 20 commits
            notes=$(git --no-pager log --no-merges --pretty=format:'- %s' -n 20 HEAD || true)
          fi
          echo "notes<<EOF" >> $GITHUB_OUTPUT
          echo "$notes" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
        shell: bash

      - name: Create or get release and create RELEASE_NOTES PR
        uses: actions/github-script@v8
        env:
          TAG_NAME: ${{ steps.determine_tag.outputs.tag_name }}
          COMMIT_NOTES: ${{ steps.commit_notes.outputs.notes }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const tag = process.env.TAG_NAME;
            if (!tag) {
              core.info('No tag determined and VERSION not changed — nothing to release.');
              return;
            }
            const { owner, repo } = context.repo;
            let release;
            // Try to get existing release by tag
            try {
              const res = await github.rest.repos.getReleaseByTag({ owner, repo, tag });
              release = res.data;
              core.info(`Found existing release for ${tag}`);
            } catch (err) {
              core.info(`No existing release for ${tag}, creating one`);
              const res = await github.rest.repos.createRelease({ owner, repo, tag_name: tag, target_commitish: context.sha, name: tag, generate_release_notes: true });
              release = res.data;
            }

            const commitNotes = process.env.COMMIT_NOTES || '';
            const bodyFromRelease = release.body || '';
            let notesBody = commitNotes.trim() ? commitNotes.trim() : bodyFromRelease;

            // Ensure notes are bullet points: prefix "- " where missing
            notesBody = notesBody.split(/\r?\n/).map(l => {
              const t = l.trim();
              if (!t) return '';
              if (/^[-*]\s+/.test(t)) return t;
              return `- ${t}`;
            }).filter(Boolean).join('\n');

            // Prepare release notes content to append with heading format DD/MM/YYYY
            const now = new Date();
            const dd = String(now.getDate()).padStart(2, '0');
            const mm = String(now.getMonth() + 1).padStart(2, '0');
            const yyyy = now.getFullYear();
            const dateStr = `${dd}/${mm}/${yyyy}`;
            const heading = `## ${tag} — ${dateStr}\n\n`;
            const newSection = heading + notesBody + '\n\n';

            // Determine default branch
            const { data: repoInfo } = await github.rest.repos.get({ owner, repo });
            const defaultBranch = repoInfo.default_branch || 'main';

            const branchName = `release-notes/${tag}`.replace(/[^a-zA-Z0-9/._-]/g, '-');
            // Create branch from default branch
            const mainRef = await github.rest.git.getRef({ owner, repo, ref: `heads/${defaultBranch}` });
            const mainSha = mainRef.data.object.sha;
            try {
              await github.rest.git.createRef({ owner, repo, ref: `refs/heads/${branchName}`, sha: mainSha });
            } catch (e) {
              core.info(`Branch refs/heads/${branchName} already exists`);
            }

            // Read RELEASE_NOTES.md from default branch (use default branch as base)
            let notesContent = '';
            let notesSha = undefined;
            try {
              const existing = await github.rest.repos.getContent({ owner, repo, path: 'RELEASE_NOTES.md', ref: defaultBranch });
              const file = Array.isArray(existing.data) ? existing.data[0] : existing.data;
              notesContent = Buffer.from(file.content, file.encoding).toString('utf8');
              notesSha = file.sha;
            } catch (e) {
              core.info('RELEASE_NOTES.md not found; creating new one');
            }

            const updated = (notesContent || '') + '\n' + newSection;

            // Create or update file in branch
            const params = {
              owner,
              repo,
              path: 'RELEASE_NOTES.md',
              message: `Add release notes for ${tag}`,
              content: Buffer.from(updated, 'utf8').toString('base64'),
              branch: branchName
            };
            if (notesSha) params.sha = notesSha;
            await github.rest.repos.createOrUpdateFileContents(params);

            // Create PR if missing
            const prs = await github.rest.pulls.list({ owner, repo, head: `${owner}:${branchName}`, base: defaultBranch });
            if (prs.data.length === 0) {
              const pr = await github.rest.pulls.create({ owner, repo, title: `Add release notes for ${tag}`, head: branchName, base: defaultBranch, body: `This PR adds the generated release notes for ${tag}.\n\nRelease: ${release.html_url}`, draft: false });
              core.info(`Created PR: ${pr.data.html_url}`);
            } else {
              core.info(`PR already exists: ${prs.data[0].html_url}`);
            }
