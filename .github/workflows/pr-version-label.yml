name: PR enforce VERSION bump (label + request changes)

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  label_and_request:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Skip labeling for release-notes branches
        if: ${{ startsWith(github.head_ref, 'release-notes/') }}
        run: |
          echo "PR is from a release-notes branch; skipping labeling and review request."

      - name: Fetch main branch
        if: ${{ !startsWith(github.head_ref, 'release-notes/') }}
        run: git fetch origin main:main

      - name: Get changed files
        id: changes
        if: ${{ !startsWith(github.head_ref, 'release-notes/') }}
        run: |
          files=$(git diff --name-only origin/main...HEAD || true)
          echo "files=$files" >> $GITHUB_OUTPUT
        shell: bash

      - name: Add label and request changes if VERSION not modified
        if: ${{ !startsWith(github.head_ref, 'release-notes/') }}
        uses: actions/github-script@v8
        env:
          FILES_CHANGED: ${{ steps.changes.outputs.files }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const filesChanged = (process.env.FILES_CHANGED || '').split(/\s+/).filter(Boolean);
            if (filesChanged.includes('VERSION')) {
              core.info('VERSION modified — no action required');
              return;
            }
            const label = 'needs-version-bump';
            // ensure label exists
            try {
              await github.rest.issues.getLabel({ owner, repo, name: label });
            } catch (e) {
              await github.rest.issues.createLabel({ owner, repo, name: label, color: 'ff0000', description: 'PR requires VERSION file bump' });
            }
            // add label to PR
            await github.rest.issues.addLabels({ owner, repo, issue_number: parseInt(process.env.PR_NUMBER, 10), labels: [label] });
            // request changes via review
            await github.rest.pulls.createReview({ owner, repo, pull_number: parseInt(process.env.PR_NUMBER, 10), event: 'REQUEST_CHANGES', body: 'Please bump the VERSION file in this PR before merging.' });
